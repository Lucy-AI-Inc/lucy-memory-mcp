AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated Lucy Memory MCP service. DNS records and egress firewall routes are operator-owned prerequisites.

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030

Parameters:
  EnvironmentName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
  ImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
    Description: Immutable ECR image URI with digest.
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ClusterArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:ecs:[a-z0-9-]+:[0-9]{12}:cluster/.+$'
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/.+$'
  Hostname:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9.-]{1,251}[a-z0-9])$'
    Description: Approved hostname used for certificate and deployment evidence; this stack does not create DNS.
  AlbIngressPrefixListId:
    Type: String
    AllowedPattern: '^pl-[a-f0-9]+$'
    Description: Customer-managed prefix list containing only approved VPN or staging client networks.
  ApprovedEgressPrefixListId:
    Type: String
    AllowedPattern: '^pl-[a-f0-9]+$'
    Description: Customer-managed prefix list for the shared authority and approved Agent Memory/auth HTTPS destinations.
  AwsEndpointSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group on private ECR, Logs, and Secrets Manager interface endpoints.
  EgressFirewallArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:network-firewall:[a-z0-9-]+:[0-9]{12}:firewall/.+$'
    Description: Firewall already routing the private subnets and enforcing the approved TLS SNI domain allowlist.
  ExecutionRepositoryArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:ecr:[a-z0-9-]+:[0-9]{12}:repository/.+$'
  UpstreamTokenSecretArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:lucy/mcp/.+$'
  InboundBearerSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:lucy/mcp/.+$'
    Description: Required only for staging-static-bearer; leave unset for production.
  HttpAuthMode:
    Type: String
    AllowedValues:
      - none
      - staging-static-bearer
    Default: none
  NodeEnvironment:
    Type: String
    AllowedValues:
      - production
      - staging
    Default: production
  AgentMemoryBaseUrl:
    Type: String
    AllowedPattern: '^https://[^/]+(?:/.*)?$'
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Exact HTTPS origins accepted by the hosted MCP transport.
  MaxRequestBodyBytes:
    Type: Number
    MinValue: 1
    MaxValue: 8192
    Description: Raw and canonical body ceiling; ALB WAF body inspection is limited to 8 KiB.
  MaxConcurrentPerTask:
    Type: Number
    MinValue: 1
  WafRequestsPerFiveMinutes:
    Type: Number
    MinValue: 10
  AdmissionModule:
    Type: String
    AllowedPattern: '^/.+\.mjs$'
    Description: Container path to the shared admission-authority adapter.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10

Rules:
  ProductionHasNoStaticBearer:
    RuleCondition: !Equals [!Ref NodeEnvironment, production]
    Assertions:
      - Assert: !Equals [!Ref HttpAuthMode, none]
        AssertDescription: Production must use auth mode none.
      - Assert: !Equals [!Ref InboundBearerSecretArn, '']
        AssertDescription: Production must not receive the staging bearer secret.
  StagingBearerHasSecret:
    RuleCondition: !Equals [!Ref HttpAuthMode, staging-static-bearer]
    Assertions:
      - Assert: !Equals [!Ref NodeEnvironment, staging]
        AssertDescription: Static bearer mode is staging-only.
      - Assert: !Not [!Equals [!Ref InboundBearerSecretArn, '']]
        AssertDescription: Staging static bearer mode requires its MCP-scoped secret.

Conditions:
  UseStaticBearer: !Equals [!Ref HttpAuthMode, staging-static-bearer]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /lucy/mcp/${EnvironmentName}
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullImageWriteLogsAndReadMcpSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Ref ExecutionRepositoryArn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref UpstreamTokenSecretArn

  StaticBearerSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: UseStaticBearer
    Properties:
      PolicyName: ReadStagingMcpBearerSecret
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref InboundBearerSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lucy MCP task ingress and allowlisted egress only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref ApprovedEgressPrefixListId
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref AwsEndpointSecurityGroupId
      Tags:
        - Key: lucy:egress-firewall
          Value: !Ref EgressFirewallArn

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lucy MCP TLS ingress from approved networks only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref AlbIngressPrefixListId

  AlbEgressToTask:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      DestinationSecurityGroupId: !Ref TaskSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Ref PublicSubnetIds
      Type: application
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: application/json
            MessageBody: '{"error":{"code":"not_found","message":"Not found."}}'
            StatusCode: '404'

  HttpsForwardRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /healthz
              - /mcp
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub lucy-memory-mcp-${EnvironmentName}
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub lucy-memory-mcp-${EnvironmentName}
        SampledRequestsEnabled: false
      Rules:
        - Name: RejectOversizedRequestBodies
          Priority: 0
          Action:
            Block:
              CustomResponse:
                ResponseCode: 413
          Statement:
            SizeConstraintStatement:
              ComparisonOperator: GT
              Size: !Ref MaxRequestBodyBytes
              FieldToMatch:
                Body:
                  OversizeHandling: MATCH
              TextTransformations:
                - Priority: 0
                  Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: oversized-request-body
            SampledRequestsEnabled: false
        - Name: RateLimitBySourceIp
          Priority: 1
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              Limit: !Ref WafRequestsPerFiveMinutes
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: source-ip-rate-limit
            SampledRequestsEnabled: false

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub lucy-mcp-${EnvironmentName}
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: lucy-mcp
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: !Ref NodeEnvironment
            - Name: HOST
              Value: 0.0.0.0
            - Name: PORT
              Value: '3000'
            - Name: LUCY_MEMORY_PERMISSIONS
              Value: memory:read,memory:propose
            - Name: LUCY_MEMORY_BASE_URL
              Value: !Ref AgentMemoryBaseUrl
            - Name: LUCY_MCP_HTTP_ALLOWED_ORIGINS
              Value: !Join [',', !Ref AllowedOrigins]
            - Name: LUCY_MCP_HTTP_AUTH_MODE
              Value: !Ref HttpAuthMode
            - Name: LUCY_MEMORY_MAX_BODY_BYTES
              Value: !Ref MaxRequestBodyBytes
            - Name: LUCY_MEMORY_MAX_CONCURRENT_PER_TASK
              Value: !Ref MaxConcurrentPerTask
            - Name: LUCY_MEMORY_ADMISSION_MODULE
              Value: !Ref AdmissionModule
          Secrets:
            - Name: LUCY_MEMORY_TOKEN
              ValueFrom: !Ref UpstreamTokenSecretArn
            - !If
              - UseStaticBearer
              - Name: LUCY_MCP_HTTP_STATIC_BEARER_TOKEN
                ValueFrom: !Ref InboundBearerSecretArn
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
      - HttpsForwardRule
      - WebAclAssociation
    Properties:
      Cluster: !Ref ClusterArn
      ServiceName: !Sub lucy-memory-mcp-${EnvironmentName}
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: false
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets: !Ref PrivateSubnetIds
      LoadBalancers:
        - ContainerName: lucy-mcp
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
      PropagateTags: SERVICE

Outputs:
  ClusterArn:
    Value: !Ref ClusterArn
  ServiceName:
    Value: !Sub lucy-memory-mcp-${EnvironmentName}
  ServiceArn:
    Value: !Ref Service
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  HttpsListenerArn:
    Value: !Ref HttpsListener
  HttpsForwardRuleArn:
    Value: !Ref HttpsForwardRule
  TargetGroupArn:
    Value: !Ref TargetGroup
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
  ConfiguredHostname:
    Value: !Ref Hostname
